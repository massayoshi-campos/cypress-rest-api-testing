
name: Cypress API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ------------------------------------------------------------------------------
# System Test Jobs - QA (Petstore API)
# ------------------------------------------------------------------------------

jobs:
  test-api-qa:
    name: QA - ${{ matrix.resource }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - resource: Pet
            spec: cypress/e2e/pet/createPet.cy.js
          - resource: Store
            spec: cypress/e2e/store/createOrder.cy.js
          - resource: User
            spec: cypress/e2e/user/createUser.cy.js

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Show Brazil date and time
        run: |
          echo "Current Date and Time (Brazil): $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M:%S')"

      - name: Run Cypress API tests
        working-directory: api
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          echo "Running spec: $SPEC"
          npm run test-qa -- --spec "$SPEC"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-${{ matrix.resource }}
          path: |
            api/mochawesome-report/
            api/cypress/reports/
          if-no-files-found: warn
          retention-days: 7
